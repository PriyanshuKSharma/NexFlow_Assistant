services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexflow-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/nexflow_data.db
    volumes:
      - nexflow-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: nexflow-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  nexflow-data:
